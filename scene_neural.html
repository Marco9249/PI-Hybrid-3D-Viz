<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Core Design | Spline Hub</title>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.5/build/spline-viewer.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }

        /* Global Typography Standardization */
        p {
            font-size: 15px;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            margin-bottom: 20px;
            letter-spacing: 0.3px;
        }
        strong, b {
            color: rgba(255, 255, 255, 0.95);
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        em, i {
            color: var(--cyan);
            font-style: italic;
        }

        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 25px;
            border-radius: 12px;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: #06B6D4; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← RETURN HOME</a>
    <spline-viewer url="https://prod.spline.design/nmnEOKgSibIrAn4p/scene.splinecode"></spline-viewer>
</body>
</html>
